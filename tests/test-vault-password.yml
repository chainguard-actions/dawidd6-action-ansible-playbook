name: Test ansible-playbook with vault_password input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create vaulted variable file and playbook
        run: |
          # Create a vault password file
          echo "mysecretpassword" > /tmp/vault-pass.txt

          # Create a vaulted variable: the string "supersecret" encrypted with password "mysecretpassword"
          # We use ansible-vault to encrypt a vars file
          mkdir -p /tmp/vault-test
          echo "secret_message: supersecret" > /tmp/vault-test/plain_vars.yml
          ansible-vault encrypt /tmp/vault-test/plain_vars.yml --vault-password-file /tmp/vault-pass.txt

          # Create a playbook that uses the vaulted variable
          cat > /tmp/test-vault-playbook.yml << 'EOF'
          ---
          - name: Test playbook with vault password
            hosts: localhost
            connection: local
            gather_facts: false
            vars_files:
              - /tmp/vault-test/plain_vars.yml
            tasks:
              - name: Print vault test message
                debug:
                  msg: "Vault password input test passed! Secret: {{ secret_message }}"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/test-vault-playbook.yml
          vault_password: mysecretpassword

      - name: Assert output contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Vault password input test passed!"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'Vault password input test passed!'"
            exit 1
          fi
