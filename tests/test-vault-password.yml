name: Test vault_password input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create vault password and encrypted variable
        run: |
          VAULT_PASS="supersecretpassword"
          echo "$VAULT_PASS" > /tmp/vault_pass.txt
          # Create a vaulted string for the secret message
          VAULTED=$(echo -n "vault secret message" | ansible-vault encrypt_string \
            --vault-password-file /tmp/vault_pass.txt \
            --stdin-name secret_msg 2>/dev/null)
          # Write vars file with vaulted variable
          cat > /tmp/vault_vars.yml << EOF
          ---
          $VAULTED
          EOF

      - name: Create test playbook using vaulted variable
        run: |
          cat > /tmp/vault-playbook.yml << 'EOF'
          ---
          - name: Vault password test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            vars_files:
              - /tmp/vault_vars.yml
            tasks:
              - name: Print vault secret
                debug:
                  msg: "Vault test passed: {{ secret_msg }}"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/vault-playbook.yml
          vault_password: supersecretpassword

      - name: Assert output contains expected message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Vault test passed"; then
            echo "PASS: output contains expected vault message"
          else
            echo "FAIL: expected output to contain 'Vault test passed'"
            exit 1
          fi
