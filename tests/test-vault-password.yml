name: Test Ansible playbook with vault_password input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Create vault-encrypted variable file
        run: |
          echo "testpassword" > /tmp/vault_pass.txt
          ansible-vault encrypt_string --vault-password-file /tmp/vault_pass.txt \
            'Hello from Vault' --name 'secret_greeting' \
            > tests/fixtures/playbooks/vault_vars.yml

      - name: Create playbook that uses vault variable
        run: |
          cat > tests/fixtures/playbooks/vault_test.yml << 'EOF'
          - name: Vault Test Playbook
            hosts: localhost
            connection: local
            gather_facts: false
            vars_files:
              - vault_vars.yml
            tasks:
              - name: Print vault variable
                debug:
                  msg: "{{ secret_greeting }}"
          EOF

      - id: action
        uses: .
        with:
          playbook: tests/fixtures/playbooks/vault_test.yml
          inventory: |
            [local]
            localhost ansible_connection=local
          vault_password: testpassword

      - name: Assert output contains vault message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Hello from Vault"; then
            echo "PASS: output contains vault-decrypted message"
          else
            echo "FAIL: expected output to contain 'Hello from Vault'"
            exit 1
          fi
