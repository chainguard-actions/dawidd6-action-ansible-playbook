name: Test ansible-playbook with Galaxy requirements input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create requirements file
        run: |
          cat > /tmp/requirements.yml << 'EOF'
          ---
          collections:
            - name: ansible.utils
              version: ">=2.0.0"
          EOF

      - name: Create test playbook
        run: |
          cat > /tmp/test-requirements-playbook.yml << 'EOF'
          ---
          - name: Test playbook with requirements
            hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Print requirements test message
                debug:
                  msg: "Requirements input test passed!"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/test-requirements-playbook.yml
          requirements: /tmp/requirements.yml

      - name: Assert output contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Requirements input test passed!"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'Requirements input test passed!'"
            exit 1
          fi
