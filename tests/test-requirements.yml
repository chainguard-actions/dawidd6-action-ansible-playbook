name: Test Ansible Galaxy requirements input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create requirements file
        run: |
          cat > /tmp/requirements.yml << 'EOF'
          ---
          roles: []
          collections: []
          EOF

      - name: Create test playbook
        run: |
          cat > /tmp/requirements-playbook.yml << 'EOF'
          ---
          - name: Requirements test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Print requirements test message
                debug:
                  msg: "Requirements test passed"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/requirements-playbook.yml
          requirements: /tmp/requirements.yml

      - name: Assert output contains expected message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Requirements test passed"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'Requirements test passed'"
            exit 1
          fi
