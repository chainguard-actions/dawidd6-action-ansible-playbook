name: Test ansible-playbook with known_hosts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create test playbook
        run: |
          cat > /tmp/test-known-hosts-playbook.yml << 'EOF'
          ---
          - name: Test playbook with known_hosts
            hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Print known_hosts test message
                debug:
                  msg: "Known hosts input test passed!"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/test-known-hosts-playbook.yml
          known_hosts: |
            github.com ssh-rsa 

      - name: Assert output contains expected content
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Known hosts input test passed!"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'Known hosts input test passed!'"
            exit 1
          fi
