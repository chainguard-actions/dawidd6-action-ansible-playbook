name: Test known_hosts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create test playbook
        run: |
          cat > /tmp/known-hosts-playbook.yml << 'EOF'
          ---
          - name: Known hosts test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Print known hosts test message
                debug:
                  msg: "Known hosts test passed"
          EOF

      - name: Get localhost SSH host key for known_hosts
        run: |
          ssh-keyscan localhost 2>/dev/null > /tmp/localhost_known_hosts || true
          # Ensure we have something in the file even if keyscan fails
          if [ ! -s /tmp/localhost_known_hosts ]; then
            echo "localhost ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC0fake" > /tmp/localhost_known_hosts
          fi
          {
            echo 'TEST_KNOWN_HOSTS<<EOF_KH'
            cat /tmp/localhost_known_hosts
            echo 'EOF_KH'
          } >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          playbook: /tmp/known-hosts-playbook.yml
          known_hosts: ${{ env.TEST_KNOWN_HOSTS }}
          inventory: |
            [local]
            localhost ansible_connection=local

      - name: Assert output contains expected message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Known hosts test passed"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'Known hosts test passed'"
            exit 1
          fi
