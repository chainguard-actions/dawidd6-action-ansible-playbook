name: Test Ansible playbook with SSH key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Generate SSH key pair for testing
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          playbook: tests/fixtures/playbooks/hello.yml
          key: ${{ env.SSH_PRIVATE_KEY }}
          inventory: |
            [local]
            localhost ansible_connection=local

      - name: Assert output contains hello message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Hello from Ansible"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'Hello from Ansible'"
            exit 1
          fi

      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output should not be empty"
            exit 1
          fi
          echo "PASS: output is non-empty"
