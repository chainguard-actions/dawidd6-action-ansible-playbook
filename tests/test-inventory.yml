name: Test custom inventory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create test playbook
        run: |
          cat > /tmp/inventory-playbook.yml << 'EOF'
          ---
          - name: Inventory test playbook
            hosts: testgroup
            connection: local
            gather_facts: false
            tasks:
              - name: Print host info
                debug:
                  msg: "Running on {{ inventory_hostname }}"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/inventory-playbook.yml
          inventory: |
            [testgroup]
            localhost ansible_connection=local

      - name: Assert output contains host info
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Running on localhost"; then
            echo "PASS: output contains expected host message"
          else
            echo "FAIL: expected output to contain 'Running on localhost'"
            exit 1
          fi
