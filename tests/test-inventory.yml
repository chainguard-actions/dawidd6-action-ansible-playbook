name: Test Ansible playbook with custom inventory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: |
          pip install ansible

      - id: action
        uses: .
        with:
          playbook: tests/fixtures/playbooks/hello.yml
          inventory: |
            [local]
            localhost ansible_connection=local

      - name: Assert output contains play recap
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "PLAY RECAP\|ok=\|localhost"; then
            echo "PASS: output contains play recap or localhost reference"
          else
            echo "FAIL: expected output to contain play recap"
            exit 1
          fi
