name: Test Ansible playbook with extra options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: |
          pip install ansible

      - id: action
        uses: .
        with:
          playbook: tests/fixtures/playbooks/vars.yml
          inventory: |
            [local]
            localhost ansible_connection=local
          options: --extra-vars "greeting=hello_world"

      - name: Assert output contains the variable value
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "hello_world"; then
            echo "PASS: output contains the extra variable value"
          else
            echo "FAIL: expected output to contain 'hello_world' from extra-vars"
            exit 1
          fi
