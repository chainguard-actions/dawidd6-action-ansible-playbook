name: Test SSH key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Generate a test SSH key and export to env
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N ""
          # Export key content as a multiline env var
          {
            echo 'TEST_SSH_KEY<<EOF_KEY'
            cat /tmp/test_key
            echo 'EOF_KEY'
          } >> "$GITHUB_ENV"

      - name: Create test playbook
        run: |
          cat > /tmp/key-playbook.yml << 'EOF'
          ---
          - name: Key test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Print key test message
                debug:
                  msg: "SSH key test passed"
          EOF

      - id: action
        uses: .
        with:
          playbook: /tmp/key-playbook.yml
          key: ${{ env.TEST_SSH_KEY }}
          inventory: |
            [local]
            localhost ansible_connection=local

      - name: Assert output contains expected message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "SSH key test passed"; then
            echo "PASS: output contains expected message"
          else
            echo "FAIL: expected output to contain 'SSH key test passed'"
            exit 1
          fi
