name: Test directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ansible
        run: pip install ansible

      - name: Create test playbook in a subdirectory
        run: |
          mkdir -p /tmp/ansible-project
          cat > /tmp/ansible-project/site.yml << 'EOF'
          ---
          - name: Directory test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Print directory message
                debug:
                  msg: "Directory test passed"
          EOF

      - id: action
        uses: .
        with:
          playbook: site.yml
          directory: /tmp/ansible-project

      - name: Assert output contains expected message
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "Directory test passed"; then
            echo "PASS: output contains expected message from directory-based playbook"
          else
            echo "FAIL: expected output to contain 'Directory test passed'"
            exit 1
          fi
